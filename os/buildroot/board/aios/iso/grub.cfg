serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=3
set default=0
menuentry 'AIOS (local API only)' {
    linux /boot/bzImage console=ttyS0
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, tune CPU threads)' {
    linux /boot/bzImage console=ttyS0 aios.autotune=1
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, tune CPU threads; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.autotune=1
    initrd /boot/rootfs.cpio.gz
}
