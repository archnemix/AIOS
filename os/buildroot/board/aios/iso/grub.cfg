serial --unit=0 --speed=115200
terminal_input serial console
terminal_output serial console
set timeout=3
set default=0
menuentry 'AIOS (local API only)' {
    linux /boot/bzImage console=ttyS0
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, tune CPU threads)' {
    linux /boot/bzImage console=ttyS0 aios.autotune=1
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, tune CPU threads; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.autotune=1
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, experimental prompt microbatch 128)' {
    linux /boot/bzImage console=ttyS0 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, experimental prompt microbatch 128; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, experimental 16k context)' {
    linux /boot/bzImage console=ttyS0 aios.context=16k
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, experimental 16k context; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.context=16k
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (external model disk, local API, 32k context)' {
    linux /boot/bzImage console=ttyS0 aios.external=1 aios.context=32k aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (external model disk, network API, 32k context; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.external=1 aios.context=32k aios.ubatch=128 aios.network=1
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, tune threads and prompt batching)' {
    linux /boot/bzImage console=ttyS0 aios.autotune=1 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, tune threads and prompt batching; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.autotune=1 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}

menuentry 'AIOS (local API, experimental Q8 key cache)' {
    linux /boot/bzImage console=ttyS0 aios.k-cache=q8_0 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}
menuentry 'AIOS (network API, experimental Q8 key cache; HTTP without TLS)' {
    linux /boot/bzImage console=ttyS0 aios.network=1 aios.k-cache=q8_0 aios.ubatch=128
    initrd /boot/rootfs.cpio.gz
}
