# Trusted build-time settings. LAN mode can also be explicitly selected in GRUB.
AIOS_LISTEN=127.0.0.1
AIOS_PORT=8080
AIOS_THREADS=auto
# auto inherits generation thread count and upstream polling policy.
AIOS_BATCH_THREADS=auto
AIOS_POLL=auto
AIOS_CONTEXT=8192
# linear2 is experimental; only use with a 16384-token context.
AIOS_ROPE_MODE=model
# 0 rejects overlong input rather than silently discarding part of it.
AIOS_CONTEXT_SHIFT=0
# 128 can improve prefill on some CPUs; auto keeps the upstream default.
AIOS_UBATCH=auto
AIOS_MODEL_MODE=external
AIOS_DATA_DEVICE=/dev/vdb
