name: Same-CPU generation model quantization screening
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-decode-quant.txt]
permissions:
  contents: write
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU and ISO tools
        run: |
          mkdir -p output/decode-quant
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/decode-quant/apt.log 2>&1 || echo 'Using cached package indexes' >> output/decode-quant/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y cpio qemu-system-x86 xorriso grub-pc-bin grub-common mtools >> output/decode-quant/apt.log 2>&1
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Screen model quantizations
        id: test
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Source commit: $(git rev-parse 23e8d8a)" results/iso/report.txt > /dev/null
          cat results/iso/aios.iso.part-* > output/decode-quant/aios.iso
          (cd output/decode-quant && sha256sum aios.iso) > output/decode-quant/actual.sha256
          diff results/iso/aios.iso.sha256 output/decode-quant/actual.sha256
          curl -fL --retry 3 'https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF/resolve/32db44d69cedb731dc0fc96f60e01a86c6f5919d/SmolLM2-135M-Instruct-Q2_K.gguf' -o output/decode-quant/q2.gguf > output/decode-quant/download.log 2>&1
          echo '478cca924101ed67bb2751f597be41532b2f4817ee2ab1b0d7cc379c76e79faf  output/decode-quant/q2.gguf' | sha256sum -c - >> output/decode-quant/download.log
          python3 scripts/os_tuning/decode_quant.py output/decode-quant/aios.iso output/decode-quant/q2.gguf > output/decode-quant/report.txt 2>&1
      - name: Record result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.test.outcome }}
          SLOT: ${{ matrix.runner }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="results/decode-quant/$RUN_ID-$SLOT"
          mkdir -p "$dest"
          printf 'source=%s outcome=%s\n' "$SOURCE" "$OUTCOME" > "$dest/status.txt"
          for f in report.txt actual.sha256 apt.log download.log; do
            if [ -f "output/decode-quant/$f" ]; then cp "output/decode-quant/$f" "$dest/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          # Keep the untracked run-specific report, but clean tracked files
          # changed by resetting an older checkout to the current branch tip.
          git restore --worktree .
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record model quantization screening $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
