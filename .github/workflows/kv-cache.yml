name: KV cache precision experiment
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-kv-cache.txt]
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - name: Build and benchmark cache settings
        id: bench
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/kv output/llama
          curl -fsSL --retry 3 https://codeload.github.com/ggml-org/llama.cpp/tar.gz/74d4f5b041ad837153b0e90fc864b8290e01d8d5 -o output/llama.tar.gz
          echo '8dd9fcc7c17f972673960ffdcc7521f52de5a9ec594aa6acebd9dfd8c17c0a5c  output/llama.tar.gz' | sha256sum -c -
          tar xzf output/llama.tar.gz -C output/llama --strip-components=1
          ./scripts/download-model.sh "$PWD/output/model.gguf" > output/kv/download.log 2>&1
          cmake -S output/llama -B output/kv/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=ON -DLLAMA_BUILD_SERVER=OFF -DLLAMA_CURL=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BMI2=ON \
            -DGGML_AVX512=OFF -DGGML_LLAMAFILE=ON > output/kv/configure.log 2>&1
          cmake --build output/kv/build --target llama-bench -j2 > output/kv/build.log 2>&1
          python3 scripts/tuning/cache.py "$PWD/output/kv/build/bin/llama-bench" "$PWD/output/model.gguf" "$PWD/output/kv" > output/kv/summary.log 2>&1
      - name: Save results
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.bench.outcome }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="results/kv-cache/$RUN_ID"
          mkdir -p "$dest"
          printf 'source=%s outcome=%s\n' "$SOURCE" "$OUTCOME" > "$dest/status.txt"
          if [ -f output/kv/results.json ]; then cp output/kv/results.json "$dest/results.json"; fi
          for f in output/kv/*.log; do
            if [ -f "$f" ]; then tail -n 60 "$f" > "$dest/$(basename "$f")"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          # Keep the untracked run-specific report, but clean tracked files
          # changed by resetting an older checkout to the current branch tip.
          git restore --worktree .
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record KV cache experiment $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
