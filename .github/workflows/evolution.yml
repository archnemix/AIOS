name: Previous and optimized ISO context comparison
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-evolution.txt]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU and ISO tools
        run: |
          mkdir -p output/evolution
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/evolution/apt.log 2>&1 || echo 'Using cached package indexes' >> output/evolution/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y qemu-system-x86 xorriso grub-pc-bin grub-common mtools >> output/evolution/apt.log 2>&1
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Compare verified images
        id: test
        shell: bash
        run: |
          set -euo pipefail
          for p in 00 01 02; do git show b63178b:results/iso/aios.iso.part-$p; done > output/evolution/old.iso
          for p in 00 01 02; do git show 6197296:results/iso/aios.iso.part-$p; done > output/evolution/new.iso
          git show b63178b:results/iso/aios.iso.sha256 | sed 's/aios.iso/old.iso/' > output/evolution/old.sha256
          git show 6197296:results/iso/aios.iso.sha256 | sed 's/aios.iso/new.iso/' > output/evolution/new.sha256
          (cd output/evolution && sha256sum -c old.sha256 && sha256sum -c new.sha256) > output/evolution/checksums.txt
          python3 scripts/os_tuning/evolution.py output/evolution/old.iso output/evolution/new.iso > output/evolution/report.txt 2>&1
      - name: Record result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.test.outcome }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="results/evolution/$RUN_ID"
          mkdir -p "$dest"
          printf 'source=%s outcome=%s\n' "$SOURCE" "$OUTCOME" > "$dest/status.txt"
          for f in report.txt checksums.txt apt.log; do
            if [ -f "output/evolution/$f" ]; then cp "output/evolution/$f" "$dest/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          git restore --worktree .
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record ISO evolution comparison $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
