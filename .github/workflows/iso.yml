name: Build and test AIOS ISO
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-iso.txt]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aios-iso-publish
  cancel-in-progress: false

jobs:
  iso:
    if: github.ref == 'refs/heads/arena/bce98461-aios'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build and test dependencies
        run: |
          mkdir -p output
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/apt.log 2>&1 || echo "Using cached package indexes" >> output/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y build-essential file wget cpio e2fsprogs unzip rsync bc bison flex libncurses-dev libssl-dev xorriso grub-pc-bin grub-common mtools qemu-system-x86 >> output/apt.log 2>&1
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Build and test
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output results/iso
          python3 -m unittest discover -s tests -v > output/unit.log 2>&1
          git clone --filter=blob:none https://github.com/buildroot/buildroot.git output/buildroot
          git -C output/buildroot checkout 137a566bf5353831d97c068a4c22e6df5b4d07a0
          ./scripts/download-model.sh "$PWD/output/model.gguf" > output/model.log 2>&1
          ./scripts/build-iso.sh "$PWD/output/buildroot" "$PWD/output/model.gguf" > output/build.log 2>&1
          python3 scripts/test-iso.py "$PWD/output/iso" > output/smoke.log 2>&1
      - name: Record results and publish ISO parts to branch
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p results/iso "results/iso-runs/$RUN_ID"
          {
            echo "# ISO build result"
            echo ""
            echo "Source commit: $SOURCE_SHA"
            echo "Workflow run: $RUN_ID"
            echo "Build and smoke test: $BUILD_OUTCOME"
            echo ""
            echo "## Build dependency summary"
            test ! -f output/apt.log || tail -n 15 output/apt.log
            echo ""
            echo "## Unit test summary"
            test ! -f output/unit.log || tail -n 8 output/unit.log
            echo ""
            echo "## Model download summary"
            test ! -f output/model.log || tail -n 2 output/model.log | cut -c1-300
            echo ""
            echo "## Build summary"
            test ! -f output/build.log || tail -n 30 output/build.log | cut -c1-300
            echo ""
            echo "## QEMU smoke test"
            test ! -f output/smoke.log || cat output/smoke.log
          } > "results/iso-runs/$RUN_ID/report.txt"
          # Only replace the last tested ISO when all checks, including the
          # opt-in tuning boot, have passed.
          if [ "$BUILD_OUTCOME" = success ]; then
            cp "results/iso-runs/$RUN_ID/report.txt" results/iso/report.txt
            rm -f results/iso/aios.iso.part-* results/iso/aios.iso.sha256
            split -b 45M -d -a 2 output/iso/aios.iso results/iso/aios.iso.part-
            (cd output/iso && sha256sum aios.iso) > results/iso/aios.iso.sha256
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Preserve newer code changes or a previous run's report; only publish
          # files in results/iso on top of the current remote branch tip.
          git fetch origin arena/bce98461-aios
          # A slower, older build must never replace a newer image/report. The
          # workflow is serialized, and the ancestry check also covers runs
          # started before serialization was introduced.
          published_source=$(git show origin/arena/bce98461-aios:results/iso/report.txt 2>/dev/null | sed -n 's/^Source commit: //p' | head -n 1)
          if [ -n "$published_source" ] && [ "$published_source" != "$SOURCE_SHA" ] && git merge-base --is-ancestor "$SOURCE_SHA" "$published_source"; then
            echo "Skipping stale ISO result from $SOURCE_SHA; newer source $published_source is published"
            exit 0
          fi
          git reset --mixed origin/arena/bce98461-aios
          git restore --worktree . ':(exclude)results/iso'
          if [ "$BUILD_OUTCOME" != success ]; then
            # A failed run must not replace the image or its success report.
            git restore --worktree results/iso
          fi
          git add -A results/iso "results/iso-runs/$RUN_ID"
          if ! git diff --cached --quiet; then
            git commit -m "Record ISO build result for $SOURCE_SHA"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              git pull --rebase origin arena/bce98461-aios
              sleep $((attempt * 3))
            done
            exit 1
          fi
