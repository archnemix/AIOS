name: ISO compiler comparison
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-iso-compiler-comparison.txt]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU and ISO tools
        run: |
          mkdir -p output/iso-compiler
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/iso-compiler/apt.log 2>&1 || echo 'Using cached package indexes' >> output/iso-compiler/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y qemu-system-x86 xorriso grub-pc-bin grub-common mtools >> output/iso-compiler/apt.log 2>&1
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Compare verified images
        id: test
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Source commit: $(git rev-parse 05d2a9f)" results/iso/report.txt > /dev/null
          grep -F 'Build and smoke test: success' results/iso/report.txt > /dev/null
          for p in 00 01 02; do git show b63178b:results/iso/aios.iso.part-$p; done > output/iso-compiler/o2.iso
          git show b63178b:results/iso/aios.iso.sha256 | sed 's/aios.iso/o2.iso/' > output/iso-compiler/o2.sha256
          cat results/iso/aios.iso.part-* > output/iso-compiler/o3.iso
          sed 's/aios.iso/o3.iso/' results/iso/aios.iso.sha256 > output/iso-compiler/o3.sha256
          (cd output/iso-compiler && sha256sum -c o2.sha256 && sha256sum -c o3.sha256) > output/iso-compiler/checksums.txt
          python3 scripts/test-compiler-iso.py output/iso-compiler/o2.iso output/iso-compiler/o3.iso > output/iso-compiler/report.txt 2>&1
      - name: Record result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.test.outcome }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "results/iso-compiler/$RUN_ID"
          echo "source=$SOURCE outcome=$OUTCOME" > "results/iso-compiler/$RUN_ID/status.txt"
          for f in report.txt checksums.txt apt.log; do
            if [ -f "output/iso-compiler/$f" ]; then cp "output/iso-compiler/$f" "results/iso-compiler/$RUN_ID/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          git add "results/iso-compiler/$RUN_ID"
          if ! git diff --cached --quiet; then
            git commit -m "Record ISO compiler comparison $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
