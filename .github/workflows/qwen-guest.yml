name: External Qwen ISO and Linux comparison
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-qwen-guest.txt]
permissions:
  contents: write
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU and ISO tools
        run: |
          mkdir -p output/qwen-guest
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/qwen-guest/apt.log 2>&1 || echo 'Using cached package indexes' >> output/qwen-guest/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y cpio xorriso e2fsprogs qemu-system-x86 grub-pc-bin grub-common mtools >> output/qwen-guest/apt.log 2>&1
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Verify models and compare Linux with AIOS
        id: test
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Source commit: $(git rev-parse 75223c6)" results/iso/report.txt > /dev/null
          cat results/iso/aios.iso.part-* > output/qwen-guest/aios.iso
          (cd output/qwen-guest && sha256sum aios.iso) > output/qwen-guest/actual.sha256
          diff results/iso/aios.iso.sha256 output/qwen-guest/actual.sha256
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/9217f5db79a29953eb74d5343926648285ec7e67/qwen2.5-0.5b-instruct-q3_k_m.gguf' -o output/qwen-guest/qwen.gguf > output/qwen-guest/download.log 2>&1
          echo '590d2479d401db206fe12a4562294d2de6211e06338a6e34fbad64b32f1469d0  output/qwen-guest/qwen.gguf' | sha256sum -c - >> output/qwen-guest/download.log
          python3 scripts/os_tuning/qwen_guest.py output/qwen-guest/aios.iso output/qwen-guest/qwen.gguf > output/qwen-guest/report.txt 2>&1
      - name: Record result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.test.outcome }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="results/qwen-guest/$RUN_ID"
          mkdir -p "$dest"
          printf 'source=%s outcome=%s\n' "$SOURCE" "$OUTCOME" > "$dest/status.txt"
          for f in report.txt actual.sha256 apt.log download.log; do
            if [ -f "output/qwen-guest/$f" ]; then cp "output/qwen-guest/$f" "$dest/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          git restore --worktree .
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record external Qwen ISO comparison $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
