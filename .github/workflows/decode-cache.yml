name: Same-CPU generation cache screening
on:
  push:
    branches: [arena/bce98461-aios]
    paths: [ci/run-decode-cache.txt]
permissions:
  contents: write
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install QEMU and ISO tools
        run: |
          mkdir -p output/decode-cache
          opts='-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true -o DPkg::Lock::Timeout=30'
          timeout 120 sudo apt-get update $opts > output/decode-cache/apt.log 2>&1 || echo 'Using cached package indexes' >> output/decode-cache/apt.log
          timeout 600 sudo apt-get install $opts --no-install-recommends -y cpio qemu-system-x86 xorriso grub-pc-bin grub-common mtools >> output/decode-cache/apt.log 2>&1
          if ! command -v perf >/dev/null; then
            timeout 300 sudo apt-get install $opts --no-install-recommends -y linux-tools-generic >> output/decode-cache/apt.log 2>&1 || echo 'perf unavailable' >> output/decode-cache/apt.log
          fi
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Screen attention and cache settings
        id: test
        shell: bash
        run: |
          set -euo pipefail
          grep -F "Source commit: $(git rev-parse 23e8d8a)" results/iso/report.txt > /dev/null
          cat results/iso/aios.iso.part-* > output/decode-cache/aios.iso
          (cd output/decode-cache && sha256sum aios.iso) > output/decode-cache/actual.sha256
          diff results/iso/aios.iso.sha256 output/decode-cache/actual.sha256
          python3 scripts/os_tuning/decode_cache.py output/decode-cache/aios.iso output/decode-cache > output/decode-cache/report.txt 2>&1
      - name: Record result
        if: always()
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          OUTCOME: ${{ steps.test.outcome }}
          SLOT: ${{ matrix.runner }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          dest="results/decode-cache/$RUN_ID-$SLOT"
          mkdir -p "$dest"
          printf 'source=%s outcome=%s\n' "$SOURCE" "$OUTCOME" > "$dest/status.txt"
          for f in report.txt actual.sha256 apt.log perf-stat.csv; do
            if [ -f "output/decode-cache/$f" ]; then cp "output/decode-cache/$f" "$dest/$f"; fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin arena/bce98461-aios
          git reset --mixed origin/arena/bce98461-aios
          # Keep the untracked run-specific report, but clean tracked files
          # changed by resetting an older checkout to the current branch tip.
          git restore --worktree .
          git add "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Record decode cache screening $RUN_ID"
            for attempt in 1 2 3 4; do
              git pull --rebase origin arena/bce98461-aios
              if git push origin HEAD:arena/bce98461-aios; then exit 0; fi
              sleep $((attempt * 3))
            done
            exit 1
          fi
